services:

  mysql:
    image: mysql:8.0
    container_name: katallo-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: katallo

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .

    container_name: backend-katallo

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_HOST: mysql

volumes:
  mysql_data: